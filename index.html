<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FPT Polytechnic - Thông tin sinh viên</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Thanh màu cam phía trên */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: #f4511e;
        }

        .card {
            width: 450px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        /* Header */
        .header {
            background: #111111;
            color: white;
            padding: 30px;
            position: relative;
        }

        .header::after {
            content: "";
            position: absolute;
            right: -30px;
            top: -40px;
            width: 130px;
            height: 130px;
            background: #f4511e;
            border-radius: 50%;
            opacity: 0.9;
        }

        .brand {
            color: #f4511e;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 28px;
            line-height: 1.2;
        }

        .header p {
            margin-top: 8px;
            color: #bbbbbb;
        }

        /* Avatar */
        .avatar {
            width: 85px;
            height: 85px;
            background: #f4511e;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            margin: -42px auto 20px;
            position: relative;
            z-index: 2;
            border: 6px solid white;
        }

        /* Nội dung */
        .content {
            padding: 10px 30px 30px;
        }

        .info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 17px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #fff1eb;
            color: #f4511e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 19px;
            font-weight: bold;
        }

        .text {
            flex: 1;
        }

        .label {
            font-size: 12px;
            color: #999999;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .value {
            font-size: 16px;
            font-weight: bold;
            color: #222222;
        }

        /* Footer */
        .footer {
            background: #111111;
            color: white;
            text-align: center;
            padding: 18px;
            font-size: 13px;
        }

        .footer span {
            color: #f4511e;
            font-weight: bold;
        }

        /* Hiệu ứng */
        .info {
            transition: 0.3s;
        }

        .info:hover {
            transform: translateX(6px);
        }
    </style>
</head>

<body>

    <div class="top-bar"></div>

    <div class="card">

        <!-- Header -->
        <div class="header">
            <div class="brand">FPT POLYTECHNIC</div>

            <h1>STUDENT<br>PROFILE</h1>

            <p>Thông tin sinh viên</p>
        </div>

        <!-- Avatar -->
        <div class="avatar">
            NA
        </div>

        <!-- Thông tin -->
        <div class="content">

            <div class="info">
                <div class="icon">👤</div>

                <div class="text">
                    <div class="label">Họ và tên</div>
                    <div class="value">Nguyễn Ngọc Nhẫn</div>
                </div>
            </div>

            <div class="info">
                <div class="icon">ID</div>

                <div class="text">
                    <div class="label">Mã số sinh viên</div>
                    <div class="value">PS51493</div>
                </div>
            </div>

            <div class="info">
                <div class="icon">📚</div>

                <div class="text">
                    <div class="label">Học phần</div>
                    <div class="value">Phát triển phần mềm</div>
                </div>
            </div>

            <div class="info">
                <div class="icon">🏫</div>

                <div class="text">
                    <div class="label">Trường</div>
                    <div class="value">Cao đẳng FPT Polytechnic</div>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            <span>FPT POLYTECHNIC</span> · Learn - Practice - Work
        </div>

    </div>

</body>
</html>
